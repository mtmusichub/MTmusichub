<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6fa"><title>MT MusicHub Admin</title><link rel="stylesheet" href="style.css"></head><body>
<main class="admin-page">
<header class="admin-top"><a class="brand" href="index.html"><span class="brand-mark">MT</span><span>MusicHub <span class="muted">Admin</span></span></a><button id="logoutAdmin" class="btn btn-light" hidden>Logout</button></header>
<section id="adminLogin" class="panel" style="max-width:460px;margin:30px auto"><h2>Admin login</h2><p class="muted">Use your existing Firebase admin account.</p><form id="adminLoginForm" class="admin-form"><label>Email<input id="adminEmail" type="email" required autocomplete="username"></label><label>Password<input id="adminPassword" type="password" required autocomplete="current-password"></label><button class="btn btn-primary">Login</button></form><p id="loginStatus" class="status"></p></section>
<section id="adminWorkspace" hidden>
<div class="tabs"><button class="tab active" data-tab="albums">Albums</button><button class="tab" data-tab="songs">Songs</button></div>
<div id="albumPanel" class="admin-grid">
<section class="panel"><h2>Add Album</h2><form id="albumForm" class="admin-form"><label>Album name<input id="albumName" required maxlength="140"></label><div class="form-row"><label>Year<input id="albumYear" type="number" min="1900" max="2100" placeholder="2026"></label><label>Language<select id="albumLanguage"><option>Malayalam</option><option>Tamil</option></select></label></div><label>Album cover image URL<input id="albumCover" type="url" placeholder="https://..."></label><button class="btn btn-primary">Add Album</button></form><p id="albumStatus" class="status"></p></section>
<section class="panel"><h2>Album List</h2><div class="list-tools"><input id="albumSearch" placeholder="Search albums..."></div><div id="albumList">Loading albums…</div></section>
</div>
<div id="songPanel" class="admin-grid hidden">
<section class="panel"><h2>Add Song</h2><form id="songForm" class="admin-form"><label>Select album<select id="songAlbumSelect" required><option value="">Choose album</option></select></label><label>Song name<input id="songName" required maxlength="140"></label><label>Singer(s)<input id="songSinger" required maxlength="180"></label><label>Music director<input id="musicDirector" maxlength="140"></label><div class="form-row"><label>Language<select id="songLanguage"><option>Malayalam</option><option>Tamil</option></select></label><label>Download allowed<select id="songDownload"><option value="false">Stream only</option><option value="true">Yes, permitted</option></select></label></div><label>Song cover URL (optional)<input id="songCover" type="url" placeholder="Leave blank to use album cover"></label><label>Audio file URL (Cloudflare R2)<input id="songAudio" type="url" required placeholder="https://pub-...r2.dev/song.mp3"></label><label style="display:flex;flex-direction:row;align-items:flex-start;gap:8px"><input id="songAuthorized" type="checkbox" required style="width:auto">I confirm I own or have permission to distribute this audio.</label><button class="btn btn-primary">Add Song</button></form><p id="songStatus" class="status"></p></section>
<section class="panel"><h2>Song List</h2><div class="list-tools"><input id="songSearch" placeholder="Search songs..."></div><div id="adminSongList">Loading songs…</div></section>
</div>
</section><p class="status"><a href="index.html">← Back to Home</a></p>
</main><div id="toast" class="toast"></div><script type="module" src="admin.js"></script></body></html>
